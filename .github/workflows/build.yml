name: Build LoLo (tg5040)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for TrimUI Brick (tg5040)
        run: make tg5040

      - name: Package pak
        run: |
          cd LoLo.pak
          zip -r ../LoLo.pak.zip .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoLo.pak
          path: |
            LoLo.pak/
            LoLo.pak.zip
