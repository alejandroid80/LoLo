<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>LoLo anim</title>
<style>
body { margin:0; background:#000000; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
svg { width: 90vh; height: 90vh; }
.eye { transform-origin: center; animation: blink 3s infinite; }
@keyframes blink {
  0%, 92%, 100% { transform: scaleY(1); }
  94%, 98% { transform: scaleY(0.05); }
}
.mouth { animation: talk 1.2s infinite ease-in-out; transform-origin: center; }
@keyframes talk {
  0%, 100% { transform: scaleX(1); }
  50% { transform: scaleX(1.5); }
}
</style></head><body>
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#000000"/>
  <rect x="75" y="75" width="250" height="250" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <g class="eye">
    <rect x="130" y="150" width="45" height="45" fill="#FFFFFF"/>
  </g>
  <g class="eye">
    <rect x="225" y="150" width="45" height="45" fill="#FFFFFF"/>
  </g>
  <g class="mouth">
    <rect x="140" y="250" width="120" height="4" fill="#FFFFFF"/>
  </g>
  <text x="200" y="385" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="14">LoLo — animado</text>
</svg>
</body></html>
